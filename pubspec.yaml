name: riverpod_go_router_architecture
description: Sample Flutter app architecture with Riverpod and go_router.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  video_player: ^2.8.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/subjects.json
    - assets/data/themes.json
    - assets/data/lessons.json
    - assets/data/games.json
    - assets/videos/
